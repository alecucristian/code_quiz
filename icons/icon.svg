<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" fill="#0d0d1a" rx="64"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="#ff007f" stroke-width="6" opacity="0.4"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#00f0ff" stroke-width="4" opacity="0.3"/>
  <!-- Marquee Banner -->
  <rect x="146" y="55" width="220" height="55" fill="#181830" stroke="#ffe600" stroke-width="4" rx="8"/>
  <text x="256" y="93" font-family="'Courier New', monospace" font-size="28" font-weight="bold" fill="#00f0ff" text-anchor="middle" letter-spacing="4">★ 1984 ★</text>
  <!-- Control Base -->
  <rect x="116" y="295" width="280" height="140" fill="#181830" stroke="#00f0ff" stroke-width="8" rx="16"/>
  <line x1="120" y1="297" x2="392" y2="297" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
  <!-- Arcade Buttons -->
  <circle cx="300" cy="340" r="24" fill="#ff007f" stroke="#ffffff" stroke-width="4"/>
  <circle cx="350" cy="325" r="24" fill="#00f0ff" stroke="#ffffff" stroke-width="4"/>
  <circle cx="355" cy="375" r="24" fill="#ffe600" stroke="#ffffff" stroke-width="4"/>
  <!-- Joystick Washer -->
  <ellipse cx="190" cy="350" rx="36" ry="18" fill="#0d0d1a" stroke="#00f0ff" stroke-width="4"/>
  <!-- Joystick Shaft -->
  <line x1="190" y1="350" x2="170" y2="185" stroke="#cbd5e1" stroke-width="18" stroke-linecap="round"/>
  <line x1="187" y1="350" x2="167" y2="185" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <!-- Joystick Ball -->
  <circle cx="170" cy="185" r="54" fill="#ff145a" stroke="#ffffff" stroke-width="6"/>
  <circle cx="152" cy="168" r="14" fill="#ffffff" opacity="0.85"/>
</svg>